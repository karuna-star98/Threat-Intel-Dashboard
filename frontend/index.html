<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cybersecurity Awareness & Threat Intelligence Dashboard</title>
<style>
body{margin:0;font:14px system-ui;background:#0f172a;color:#e2e8f0}header{padding:14px 20px;background:#111c34}h1{margin:0;font-size:20px}
.note{font-size:12px;color:#fbbf24;margin-top:4px}nav button{background:none;border:0;color:#94a3b8;padding:12px 14px;cursor:pointer;font-size:14px}
nav button.on{color:#fff;border-bottom:2px solid #38bdf8}main{padding:16px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:#1e293b;border-radius:8px;padding:12px}.kpi b{display:block;font-size:26px}.row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.row span{width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row i{height:10px;background:#38bdf8;border-radius:3px;min-width:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px;border-bottom:1px solid #334155;font-size:12px}tr.c{cursor:pointer}tr.c:hover{background:#334155}
input,select,button.a{background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:5px;padding:6px;margin:2px}button.a{cursor:pointer;background:#0369a1}
.b{padding:1px 6px;border-radius:9px;font-size:11px}.CRITICAL{background:#991b1b}.HIGH{background:#c2410c}.MEDIUM{background:#a16207}.LOW{background:#166534}.INFORMATIONAL{background:#475569}
.warn{color:#fbbf24}.opt{display:block;margin:3px 0}</style></head><body>
<header><h1>Cybersecurity Awareness &amp; Threat Intelligence Dashboard</h1>
<div class="note">DEFENSIVE · SYNTHETIC / DEMO DATA ONLY. Observation ≠ Indicator ≠ Alert ≠ Threat ≠ Incident. An IOC match is NOT confirmed compromise. Nothing is ever contacted.</div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const KEY="demo-analyst-key",M=document.getElementById("main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=(u,o={})=>fetch("/api"+u,{...o,headers:{"Content-Type":"application/json","X-API-Key":KEY}}).then(r=>r.json());
const bars=(t,o)=>{const m=Math.max(1,...Object.values(o));return `<div class="card"><b>${esc(t)}</b>`+Object.entries(o).map(([k,v])=>`<div class="row"><span title="${esc(k)}">${esc(k)}</span><i style="width:${v/m*60}%"></i>${v}</div>`).join("")+`</div>`};
const sev=s=>`<span class="b ${esc(s)}">${esc(s)}</span>`;
const T={};
T.Dashboard=async()=>{const s=await api("/dashboard/stats"),tr=await api("/dashboard/trends"),c=s.cards;
M.innerHTML=`<div class="grid">${[["Total Threat Records",c.total_threats],["Critical",c.critical],["High",c.high],["Active Indicators",c.active_indicators],["Open Investigations",c.open_investigations],["Avg Confidence",c.avg_confidence+"%"],["Vulnerabilities",c.vulnerabilities]].map(([k,v])=>`<div class="card kpi">${k}<b>${v}</b></div>`).join("")}</div><br><div class="grid">`+
bars("Threats Over Time (month)",tr)+bars("By Severity",s.by_severity)+bars("By Category",s.by_category)+bars("IOC Type",s.by_indicator_type)+bars("Top ATT&CK Tactics",s.by_tactic)+bars("Top Techniques",s.by_technique)+bars("Risk Distribution",s.risk_distribution)+bars("Confidence Distribution",s.confidence_distribution)+bars("Vulnerabilities by Severity",s.vuln_by_severity)+bars("Status",s.by_status)+`</div>`};
T.Threats=async()=>{M.innerHTML=`<div class="card"><input id="fq" placeholder="search name / indicator / ID"><select id="fs"><option value="">Severity</option>${["CRITICAL","HIGH","MEDIUM","LOW","INFORMATIONAL"].map(x=>`<option>${x}</option>`).join("")}</select><select id="fc"><option value="">Category</option>${["PHISHING","MALWARE","RANSOMWARE","CREDENTIAL THREATS","WEB THREATS","NETWORK THREATS","VULNERABILITY EXPOSURE","SOCIAL ENGINEERING","DATA EXPOSURE","ACCOUNT SECURITY"].map(x=>`<option>${x}</option>`).join("")}</select><select id="ft"><option value="">Indicator type</option>${["IP_ADDRESS","DOMAIN","URL","FILE_HASH","EMAIL_DOMAIN","CVE_ID"].map(x=>`<option>${x}</option>`).join("")}</select><select id="fst"><option value="">Status</option>${["NEW","UNDER_REVIEW","MONITORING","CLOSED","FALSE_POSITIVE"].map(x=>`<option>${x}</option>`).join("")}</select><select id="fo"><option value="newest">Newest</option><option value="risk">Highest risk</option><option value="confidence">Highest confidence</option><option value="observed">Most observed</option></select><button class="a" id="go">Filter</button></div><div id="tb"></div><div id="dt"></div>`;
const load=async()=>{const p=new URLSearchParams({q:fq.value,severity:fs.value,category:fc.value,indicator_type:ft.value,status:fst.value,sort:fo.value,limit:50});[...p].forEach(([k,v])=>!v&&p.delete(k));const r=await api("/threats?"+p);
tb.innerHTML=`<table><tr><th>ID</th><th>Name</th><th>Category</th><th>Indicator</th><th>Sev</th><th>Risk</th><th>Conf</th><th>First</th><th>Last</th><th>Status</th></tr>`+r.map(t=>`<tr class="c" data-id="${esc(t.threat_id)}"><td>${esc(t.threat_id)}</td><td>${esc(t.threat_name)}</td><td>${esc(t.threat_category)}</td><td>${esc(t.indicator_value)}</td><td>${sev(t.severity)}</td><td>${t.risk_score}</td><td>${t.confidence_score}%</td><td>${esc(t.first_seen)}</td><td>${esc(t.last_seen)}</td><td>${esc(t.status)}</td></tr>`).join("")+`</table>`;
tb.querySelectorAll("tr.c").forEach(r=>r.onclick=()=>detail(r.dataset.id))};go.onclick=load;load()};
async function detail(id){const t=await api("/threats/"+id),e=t.enrichment;window.scrollTo(0,document.body.scrollHeight);
dt.innerHTML=`<div class="card"><h3>${esc(t.threat_id)} — ${esc(t.threat_name)} ${sev(t.severity)}</h3><p>${esc(t.description)}</p>
<p><b>Indicator:</b> ${esc(t.indicator_type)} <code>${esc(t.indicator_value)}</code> (do NOT visit/contact) · <b>Category:</b> ${esc(t.threat_category)} · <b>Status:</b> ${esc(t.status)}</p>
<p><b>Risk:</b> ${t.risk_score}/100 · <b>Confidence:</b> ${t.confidence_score}/100 · <b>Source:</b> ${esc(t.source_name)} (reliability ${esc(t.source_reliability)})</p><p class="warn">${esc(t.interpretation)}</p>
<p><b>ATT&CK:</b> ${t.mitre_tactic?`${esc(t.mitre_tactic)} → ${esc(t.mitre_technique)} (${esc(t.mitre_technique_id)})`:"No mapping - insufficient behavioral context"}</p>
<p><b>Related indicators (same campaign):</b> ${(e.related_indicators||[]).map(esc).join(", ")||"none"}<br><b>Related alerts:</b> ${(e.related_alerts||[]).map(esc).join(", ")||"none"}</p>
<p><b>Timeline:</b> ${t.timeline.map(x=>esc(x.step)+" ("+esc(x.date)+")").join(" → ")}</p>
<p><b>Recommended actions:</b></p><ul>${(e.recommended_actions||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
<p><b>Analyst notes:</b></p><ul>${t.notes.map(n=>`<li>${esc(n.note)} <small>${esc(n.created_at)}</small></li>`).join("")}</ul>
<input id="nt" placeholder="Add note" size="50"><button class="a" id="ns">Save note</button></div>`;
ns.onclick=async()=>{await api(`/threats/${id}/notes`,{method:"POST",body:JSON.stringify({note:nt.value})});detail(id)}}
T["IOC Search"]=()=>{M.innerHTML=`<div class="card"><b>Search Indicator</b> (IP, domain, URL, hash, CVE) — database lookup only<br><input id="sq" size="50" value="198.51.100.25"><button class="a" id="sg">Search</button><div id="sr"></div></div>`;
sg.onclick=async()=>{const r=await api("/indicators/search?q="+encodeURIComponent(sq.value));
sr.innerHTML=r.valid===false?`<p class="warn">Invalid: ${esc(r.validation_notes)}</p>`:!r.known?`<p>Type: ${esc(r.indicator_type)} · Known in Demo Dataset: <b>NO</b></p>`:`<p>Type: ${esc(r.indicator_type)}<br>Known in Demo Dataset: <b>YES</b><br>Risk: ${r.risk_score}/100 · Severity: ${sev(r.severity)} · Confidence: ${r.confidence}%<br>Categories: ${r.categories.map(esc).join(", ")}<br>First seen: ${esc(r.first_seen)} · Last seen: ${esc(r.last_seen)} · Status: ${esc(r.status)}<br>Observations: ${r.observations} · Related: ${r.related_indicators.map(esc).join(", ")||"none"}</p><p class="warn">A match is a lead to investigate, not a confirmed compromise.</p>`};sg.click()};
T.Alerts=async()=>{const a=await api("/alerts");M.innerHTML=`<table><tr><th>ID</th><th>Threat</th><th>Type</th><th>Sev</th><th>Risk</th><th>Conf</th><th>Obs</th><th>Status</th></tr>`+a.slice(0,80).map(x=>`<tr><td>${esc(x.alert_id)}</td><td>${esc(x.threat_id)}</td><td>${esc(x.alert_type)}</td><td>${sev(x.severity)}</td><td>${x.risk_score}</td><td>${x.confidence_score}%</td><td>${x.observation_count}</td><td><select data-a="${esc(x.alert_id)}">${["NEW","INVESTIGATING","MONITORING","RESOLVED","FALSE_POSITIVE"].map(s=>`<option ${s==x.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+`</table>`;
M.querySelectorAll("select").forEach(s=>s.onchange=()=>api(`/alerts/${s.dataset.a}/status`,{method:"PUT",body:JSON.stringify({status:s.value})}))};
T.Vulnerabilities=async()=>{const v=await api("/vulnerabilities");M.innerHTML=`<p class="warn">Priority = CVSS + asset criticality + exposure + known exploitation. Synthetic CVE-2099-* entries.</p><table><tr><th>CVE</th><th>Category</th><th>CVSS</th><th>Sev</th><th>Exposure</th><th>Exploited (demo)</th><th>Patch</th><th>Priority</th></tr>`+v.map(x=>`<tr><td>${esc(x.cve_id)}</td><td>${esc(x.product_category)}</td><td>${x.cvss_score}</td><td>${sev(x.severity)}</td><td>${esc(x.exposure)}</td><td>${esc(x.exploitation_status_demo)}</td><td>${x.patch_available?"yes":"no"}</td><td><b>${x.priority_score}</b></td></tr>`).join("")+`</table>`};
T.Awareness=async()=>{const m=await api("/awareness/modules");M.innerHTML=`<div class="grid">`+m.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.what)}</p><p><b>Why:</b> ${esc(x.why)}</p><p><b>Warning signs:</b> ${esc(x.warning_signs)}</p><p><b>Safe practices:</b> ${esc(x.safe_practices)}</p><p><b>If it happens:</b> ${esc(x.if_it_happens)}</p></div>`).join("")+`</div>`};
T.Quiz=async()=>{const qs=await api("/quiz");M.innerHTML=qs.map(q=>`<div class="card"><b>${q.id}. ${esc(q.question)}</b> <small>[${esc(q.category)}]</small>${q.options.map((o,i)=>`<label class="opt"><input type="radio" name="q${q.id}" value="${i}"> ${esc(o)}</label>`).join("")}</div>`).join("")+`<button class="a" id="sub">Submit</button><div id="res"></div>`;
sub.onclick=async()=>{const ans={};qs.forEach(q=>{const c=document.querySelector(`input[name=q${q.id}]:checked`);if(c)ans[q.id]=+c.value});const r=await api("/quiz/submit",{method:"POST",body:JSON.stringify({answers:ans})});
res.innerHTML=`<div class="card"><h3>Awareness Score: ${r.overall_score}/100 — ${esc(r.band)}</h3><p class="warn">${esc(r.disclaimer)}</p>${r.recommendations.map(x=>`<div>${esc(x.category)}: ${x.score}% — ${esc(x.recommendation)}</div>`).join("")}<hr>${r.review.map(x=>`<div>${x.correct?"✅":"❌"} Q${x.id}: ${esc(x.why)}</div>`).join("")}</div>`}};
T.Executive=async()=>{const s=await api("/dashboard/stats"),c=s.cards,a=s.awareness;M.innerHTML=`<div class="card"><h2>Executive Cybersecurity Summary</h2><p><b>Landscape:</b> ${c.total_threats} synthetic threat records; <b>${c.critical} critical</b> and <b>${c.high} high</b>. These are items to investigate, not confirmed incidents.</p><p><b>Top categories:</b> ${Object.entries(s.by_category).slice(0,3).map(([k,v])=>esc(k)+" ("+v+")").join(", ")}</p><p><b>Top vulnerability areas:</b> ${Object.entries(s.vuln_by_category).slice(0,3).map(([k,v])=>esc(k)+" ("+v+")").join(", ")}</p><p><b>Awareness:</b> ${a.quizzes_taken?`avg score ${a.avg_score}/100 over ${a.quizzes_taken} quizzes; weakest: ${a.weakest.map(w=>esc(w[0])+" "+w[1]+"%").join(", ")}`:"no quiz results yet"}</p><p><b>Priorities:</b> 1) Patch exposed, exploited vulnerabilities first. 2) Validate high-risk/low-confidence intelligence. 3) Run phishing and MFA awareness campaigns. 4) Keep tested offline backups.</p></div>`};
const nav=document.getElementById("nav");Object.keys(T).forEach((k,i)=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{nav.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");T[k]()};nav.appendChild(b);if(!i)b.click()});
</script></body></html>
